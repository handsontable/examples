<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Inventory — Handsontable + Symfony</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
    }

    header {
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      font-weight: 700;
    }

    header p {
      margin: 0;
      font-size: 0.875rem;
      color: #6b7280;
    }

    #example1 {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden;
    }

  </style>
</head>
<body>
  <header>
    <h1>Product Inventory</h1>
    <p>Server-side pagination, sorting, and filtering via Symfony · right-click a row for more CRUD actions</p>
  </header>

  <div id="example1"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
