<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Order Management — Handsontable + Rails API</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
    }

    header {
      margin-bottom: 20px;
    }

    header h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      font-weight: 700;
    }

    header p {
      margin: 0;
      font-size: 0.875rem;
      color: #6b7280;
    }

    #app {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden;
    }

    nav {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    nav a {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      background: #e5e7eb;
      color: #374151;
    }

    nav a.active {
      background: #1a1a2e;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Order Management — Handsontable + Rails</h1>
    <p>Server-side pagination, sorting, and filtering via Rails API · right-click a row for more CRUD actions</p>
  </header>

  <nav>
    <a href="/" class="active">JS</a>
    <a href="/angular.html">Angular</a>
    <a href="/react.html">React</a>
  </nav>

  <div id="app"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
