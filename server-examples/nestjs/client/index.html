<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handsontable + NestJS — Server-Side Data</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 24px 32px;
      background: #f8f9fa;
      color: #1a1a2e;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 4px;
    }

    #status-label {
      font-size: 13px;
      color: #6c757d;
      display: block;
      margin-bottom: 16px;
      min-height: 20px;
    }

    #example1 {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }

<body>
  <h1>Support Tickets</h1>
