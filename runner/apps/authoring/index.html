<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handsontable Demos — Authoring</title>
    <!-- Theme mode must be on <html> before the first paint, or a dark-mode reload
         flashes light. Runs synchronously ahead of the module script; React reads
         this attribute rather than re-deriving the mode. Keep in sync with
         THEME_ATTR / THEME_STORAGE_KEY in packages/editor-shell/src/theme.ts. -->
    <script>
      (function () {
        var m = null;
        // Reading storage throws outright when it is disabled (Safari private mode,
        // blocked cookies). Guard it alone, so losing it doesn't also lose the OS
        // preference — the whole point of the fallback.
        try { m = localStorage.getItem("hot-theme"); } catch (e) {}
        if (m !== "light" && m !== "dark") {
          try {
            m = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch (e) { m = "light"; }
        }
        document.documentElement.setAttribute("data-hot-theme", m);
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      * { box-sizing: border-box; }
      /* The only colour literals outside theme.ts (besides the logo SVGs): the
         custom properties don't exist yet this early, and this is what fills the
         viewport before React mounts. Mirrors --hot-color-surface. */
      html, body { background: #ffffff; }
      html[data-hot-theme="dark"], html[data-hot-theme="dark"] body { background: #070604; }
      /* Universal rollover for every button and link (works over inline styles
         since `filter` isn't set inline). */
      button, a { transition: filter 0.12s ease, background-color 0.12s ease; }
      button:hover, a:hover { filter: brightness(0.92); cursor: pointer; }
      button:active, a:active { filter: brightness(0.85); }
      /* Cascader rows get a subtle hover background (inline-selected rows keep
         their accent via !important-free specificity — selected wins visually). */
      .hot-casc-row { transition: background-color 0.12s ease; }
      .hot-casc-row:hover { background: var(--hot-color-hover); }
      .hot-casc-header { transition: background-color 0.12s ease; }
      .hot-casc-header:hover { background: var(--hot-color-hover); }
      /* The cascader's rows are divs carrying a roving tabindex (T7), so they get
         no UA focus ring of their own. :focus-visible keeps it off mouse clicks. */
      .hot-casc-row:focus-visible, .hot-casc-header:focus-visible {
        outline: 2px solid var(--hot-color-accent);
      }
      /* Borderless square icon buttons (theme toggle today; the row-2 icons in T2).
         Needs a class because :hover can't be expressed inline. */
      .hot-icon-btn:hover { background: var(--hot-color-hover); }
      /* Sidebar rows (T3). The row actions and the npm external-link are drawn at
         opacity 0 and revealed on hover (72:17018, 72:17074) — inline styles can't
         express either the hover or the descendant selector. :focus-within is not
         optional: an opacity-0 button is still tabbable, so without it keyboard focus
         lands on something invisible. */
      .hot-file-row { transition: background-color 0.12s ease; }
      /* Both fills live here rather than inline: an inline background outranks a
         stylesheet :hover rule, so an inline one would kill the hover entirely. Equal
         specificity, so source order decides — hover last, and it wins on the active
         row too. */
      .hot-file-row[data-active="true"] { background: var(--hot-color-surface-muted); }
      .hot-file-row:hover { background: var(--hot-color-hover); }
      .hot-row-actions, .hot-dep-link { opacity: 0; transition: opacity 0.12s ease; }
      .hot-file-row:hover .hot-row-actions,
      .hot-file-row:focus-within .hot-row-actions,
      .hot-dep-row:hover .hot-dep-link,
      .hot-dep-row:focus-within .hot-dep-link { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
