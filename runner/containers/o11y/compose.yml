# containers/o11y/compose.yml — local stand-in for the Grafana box (ADR-0041
# §I, docs/observability-contract.md §10). No `container_name`/`name:` —
# compose's automatic `<project>_<key>` naming keeps every project's
# resources distinct, so multiple worktrees run this under their own
# `COMPOSE_PROJECT_NAME`.
#
# `minio-data`/`clickhouse-data` are NAMED volumes (kept across `down`,
# unlike `-v`); the o11y worker's own Durable Object state persists too, so
# `dev.mjs --fresh` wipes both together (`resetO11yLocalState`) to avoid
# divergence. `box` itself is ephemeral — nothing in it survives a restart.
#
# Run with COMPOSE_PROJECT_NAME + O11Y_*_PORT env vars (each worktree uses
# its own block); unset, every port defaults to the contract's own values.

services:
  box:
    build:
      context: .
    environment:
      # No default: an empty WAKE_ID makes the supervisor REFUSE to write a
      # marker. Every caller must set O11Y_WAKE_ID explicitly.
      WAKE_ID: ${O11Y_WAKE_ID:-}
      STORAGE: s3
      LOKI_S3_ENDPOINT: minio:9000
      LOKI_S3_REGION: auto
      # Independent from MinIO's own root credentials: the C1 negative
      # control (stop-roundtrip.mjs) runs the box against a restricted MinIO
      # user. Defaults match MinIO's own default root credentials.
      LOKI_S3_ACCESS_KEY_ID: ${O11Y_LOKI_S3_ACCESS_KEY_ID:-minioadmin}
      LOKI_S3_SECRET_ACCESS_KEY: ${O11Y_LOKI_S3_SECRET_ACCESS_KEY:-minioadmin}
      LOKI_S3_BUCKET: loki
      LOKI_S3_INSECURE: "true"
      GF_SERVER_ROOT_URL: http://localhost:${O11Y_GRAFANA_PORT:-3000}/grafana/
      # vertamedia-clickhouse-datasource needs a full URL + ONE header pair
      # (X-ClickHouse-User/-Key), unlike production's single Bearer header.
      # No standalone AE_SQL_TOKEN var — it reaches Grafana as the VALUE of
      # O11Y_CLICKHOUSE_HEADER2_VALUE below.
      O11Y_CLICKHOUSE_URL: http://clickhouse:8123
      O11Y_CLICKHOUSE_DATABASE: default
      O11Y_CLICKHOUSE_HEADER1_NAME: X-ClickHouse-User
      O11Y_CLICKHOUSE_HEADER1_VALUE: default
      O11Y_CLICKHOUSE_HEADER2_NAME: X-ClickHouse-Key
      O11Y_CLICKHOUSE_HEADER2_VALUE: ${AE_SQL_TOKEN:-local-dev-token}
      O11Y_STOP_GRACE_SECONDS: ${O11Y_STOP_GRACE_SECONDS:-30}
    ports:
      - "127.0.0.1:${O11Y_GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${O11Y_LOKI_PORT:-3100}:3100"
    # Must exceed O11Y_STOP_GRACE_SECONDS so the stop protocol's remaining
    # steps can run before Docker SIGKILLs; raise both together, by hand.
    # Default 30s was measured (~2.3s) against short local test streams —
    # not yet validated against production traffic (ADR-0041 exit criterion 7).
    stop_grace_period: 45s
    # `standard-1` (docs.cloudflare.com/containers/platform-details/limits):
    # 1/2 vCPU, 4 GiB memory, 8 GB disk — so local boot-time and memory
    # measurements mean the same thing the sandbox probe will measure.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 4g
    depends_on:
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_started

  # Upstream MinIO stopped distributing public community images (2026-09).
  # Replaced with Bitnami's frozen "legacy" mirror of the same release line,
  # pinned by DIGEST; verified end to end against the C1 negative control
  # below (a real denied PUT under a deny-`s3:PutObject` policy).
  minio:
    image: bitnamilegacy/minio@sha256:81cd091fb9f14b2e9e9bfa6dbc2bf2d46fdd5eafa6c5e7c9213baf4256ff13d6 # 2024.11.7, verified linux/amd64+arm64 (`docker buildx imagetools inspect`)
    # A data service (unlike `box`): if Docker OOM-kills minio/clickhouse,
    # every write after that point is silently dropped until restarted by
    # hand (observed for real under Docker Desktop's default memory limit).
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${O11Y_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${O11Y_MINIO_ROOT_PASSWORD:-minioadmin}
      # Replaces the old `minio-init` one-shot container (quay.io/minio/mc
      # is also gone) — Bitnami's own entrypoint creates the bucket itself
      # before MinIO starts listening; the healthcheck confirms it on disk.
      MINIO_DEFAULT_BUCKETS: loki
    volumes:
      # Bitnami's image data dir differs from upstream minio/minio's `/data`
      # (`docker inspect` on the image: `Volumes: {"/bitnami/minio/data"}`).
      - minio-data:/bitnami/minio/data
    ports:
      - "127.0.0.1:${O11Y_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${O11Y_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      # Checks the bucket dir AND the live endpoint: Bitnami's entrypoint
      # briefly runs a throwaway MinIO instance first, which a bare
      # `/minio/health/live` check could latch "healthy" against.
      test: ["CMD-SHELL", "test -d /bitnami/minio/data/loki && curl -f http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Analytics Engine stand-in (§10): a `runner_events` table shaped like the
  # real AE SQL API response, queried through the same allowlisting helper.
  clickhouse:
    image: clickhouse/clickhouse-server:24.10-alpine
    # Data service — see minio's own comment above (this is the exact
    # container observed OOM-killed under Docker Desktop's default limit).
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      # The Grafana datasource always sends a password; give the local user
      # the same value so the health check exercises real auth.
      CLICKHOUSE_PASSWORD: ${AE_SQL_TOKEN:-local-dev-token}
    volumes:
      - ./local/clickhouse-init.sql:/docker-entrypoint-initdb.d/clickhouse-init.sql:ro
      # Only runs on a genuinely empty data dir; a persisted volume already
      # has `runner_events` and this is skipped, which is the point.
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:${O11Y_CLICKHOUSE_PORT:-8123}:8123"
      - "127.0.0.1:${O11Y_CLICKHOUSE_NATIVE_PORT:-9009}:9000"

volumes:
  minio-data:
  clickhouse-data:
