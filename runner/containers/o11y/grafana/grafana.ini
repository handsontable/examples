; ADR-0041 §A, §B.5, §H. Pinned settings a config test guards
; (pipeline/o11y-box-config.test.mjs). Values that must vary per environment
; (root_url host:port, plugin token, datasource endpoints) are supplied by
; GF_* environment variables or provisioning-file env expansion instead of
; being hard-coded here, so this file never needs editing per deploy.
;
; Trap: any GF_SERVER_*, GF_AUTH_PROXY_*, GF_LIVE_* env var set in compose.yml
; or wrangler.jsonc silently overrides the pinned values below. Do not set
; those — override only GF_SERVER_ROOT_URL (host/port) and datasource-level
; values via provisioning env expansion.

[server]
protocol = http
http_port = 3000
domain = localhost
; The Worker/compose sets GF_SERVER_ROOT_URL to the real host; this default
; keeps `docker compose up` usable standalone.
root_url = http://localhost:3000/grafana/
serve_from_sub_path = true

[auth]
disable_login_form = true
disable_signout_menu = true
oauth_auto_login = false

[auth.anonymous]
enabled = false

[auth.basic]
; auth.proxy is meant to be the ONLY trusted identity (X-O11Y-GRAFANA-USER,
; set by the Worker; a client-sent copy is stripped — ADR-0041 §B.5). Basic
; auth left enabled would let anyone who reaches the box's HTTP port at all
; authenticate as the default admin, independent of whether T03's proxy
; happens to forward an Authorization header. Verified: with this disabled,
; `curl -u admin:admin ...` gets 401, not 200.
enabled = false

[auth.proxy]
enabled = true
header_name = X-O11Y-GRAFANA-USER
header_property = username
auto_sign_up = true
sync_ttl = 15
whitelist =
headers =
enable_login_token = false

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer
viewers_can_edit = false

[live]
; ADR-0041 §A: Grafana Live disabled — see also ADR-0041 alternatives
; (revision 2's Alloy design). T01-D1 (updated, fix round 1): this DOES turn
; Live off for Grafana's own frontend — `GET /api/frontend/settings` reports
; `liveEnabled: false` with this set (verified on 11.4.0), so the shipped
; Grafana UI never opens a Live socket and never retries one on an idle tab.
; It does NOT refuse a client that dials `/api/live/ws` directly, though:
; both the plain HTTP upgrade (101) and a full Centrifuge `connect`
; handshake (a real client id, ping/pong) succeed regardless of this value —
; reproduced on 11.4.0 and 12.2.0, over both HTTP Basic auth and a real
; cookie session, matching the still-open grafana/grafana#72072. Safe for
; the product surface, not a hard refusal of the endpoint itself.
; GrafanaBox.containerFetch (workers/o11y/src/box.ts, T01 phase 2) still
; rejects any /api/live/* path before it reaches this container as
; defense-in-depth against a client that bypasses Grafana's own frontend —
; the container is never reachable except through the Worker (ADR-0041 §A).
max_connections = 0

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[security]
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict
allow_embedding = false
; No default admin account to fall back to once [auth.basic] is off.
disable_initial_admin_creation = true

[dashboards]
default_home_dashboard_path =

[plugins]
allow_loading_unsigned_plugins =
; Grafana 11's default background preinstall of grafana-lokiexplore-app
; fetches a zip from grafana.com on every cold start otherwise: an unpinned,
; not-image-baked dependency on exit criterion 6 (cold start). Every plugin
; this box needs is installed at build time (Dockerfile), pinned by version.
preinstall_disabled = true

[log]
mode = console
level = info

[database]
; sqlite state is disposable (ADR-0041 §A) — no external DB, ephemeral disk.
type = sqlite3
path = /var/lib/grafana/grafana.db
