# ADR-0041 §A, §B.5. One Loki datasource per tenant (X-Scope-OrgID); the ClickHouse
# variants live in ../../clickhouse/ and the supervisor copies one in at start.
# Fixed `uid`s: Grafana's sqlite state is disposable (fresh on every wake), so
# uid-referencing dashboards would break if these were auto-generated.
# Grafana expands ${VAR} here (since v8.0): never hard-code an endpoint or credential.
apiVersion: 1

datasources:
  - name: Loki (browser)
    uid: loki-browser
    type: loki
    access: proxy
    url: http://localhost:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      maxLines: 1000
    secureJsonData:
      httpHeaderValue1: browser
    editable: false
    isDefault: false

  - name: Loki (worker)
    uid: loki-worker
    type: loki
    access: proxy
    url: http://localhost:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      maxLines: 1000
    secureJsonData:
      httpHeaderValue1: worker
    editable: false
    isDefault: true
