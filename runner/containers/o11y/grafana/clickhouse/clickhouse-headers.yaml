# ADR-0041 §A, §B.5. ClickHouse datasource for the local ClickHouse container
# (credentials sent as two custom headers). Same fixed uid as the other variant.
apiVersion: 1

datasources:
  # vertamedia-clickhouse-datasource ("the Altinity plugin", ADR-0041 §A) —
  # NOT grafana-clickhouse-datasource. Cloudflare's own Analytics Engine +
  # Grafana docs point at this exact plugin id and this exact auth shape: a
  # full URL plus ONE custom HTTP header, never host/port/user/password
  # fields (the AE SQL API rejects Basic auth outright — verified against a
  # real ClickHouse HTTP endpoint too, which 403s a bare `Bearer` scheme).
  # Local ClickHouse and production Analytics Engine need genuinely
  # different header shapes (ClickHouse HTTP: X-ClickHouse-User/-Key), so
  # the header NAMES are env-driven too — compose.yml supplies the local
  # pair. Production uses clickhouse-bare.yaml instead.
  - name: ClickHouse (runner_events)
    uid: clickhouse-runner-events
    type: vertamedia-clickhouse-datasource
    access: proxy
    url: ${O11Y_CLICKHOUSE_URL}
    jsonData:
      httpHeaderName1: ${O11Y_CLICKHOUSE_HEADER1_NAME}
      httpHeaderName2: ${O11Y_CLICKHOUSE_HEADER2_NAME}
      defaultDatabase: ${O11Y_CLICKHOUSE_DATABASE}
      addCorsHeader: false
    secureJsonData:
      httpHeaderValue1: ${O11Y_CLICKHOUSE_HEADER1_VALUE}
      httpHeaderValue2: ${O11Y_CLICKHOUSE_HEADER2_VALUE}
    editable: false
