# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy from repo root or set root dir to render-ms in Dashboard.

services:
  - type: web
    name: csb-devbox-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: GITHUB_TOKEN
        sync: false
      - key: CSB_API_KEY
        sync: false
      - key: SLACK_WEBHOOK
        sync: false
        optional: true
