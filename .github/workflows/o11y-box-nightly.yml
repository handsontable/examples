name: o11y GrafanaBox nightly

# Builds the GrafanaBox image (Loki + Grafana + supervisor) and runs
# containers/o11y/local/stop-roundtrip.mjs against a real docker compose
# stack: the only CI exercise of the box's stop/restore ledger. The idle-stop
# job runs containers/o11y/local/idle-stop.mjs under `wrangler dev` with a
# shortened sleepAfter (O11Y_SLEEP_AFTER, honored only when O11Y_ENV=local).

on:
  workflow_dispatch: {}
  schedule:
    # Clear of the other windows (01:00 starter matrix, 02:30 o11y-local,
    # 03:00 e2e-live, Monday 04:00 server-examples, Monday 05:00 examples-build).
    - cron: '15 4 * * *'
  pull_request:
    paths:
      - 'runner/containers/o11y/**'
      - 'runner/workers/o11y/src/box.ts'
      - '.github/workflows/o11y-box-nightly.yml'

permissions:
  contents: read

# All state lives inside this runner's own Docker daemon, so cancelling is safe.
concurrency:
  group: o11y-box-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # stop-roundtrip.mjs is plain Node (no workspace install needed).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node v5 auto-enables pnpm caching from the root `packageManager`
          # field; this job never installs pnpm.
          package-manager-cache: false

      - name: Build the box image
        run: docker compose -p o11y-stop-roundtrip -f runner/containers/o11y/compose.yml build box

      - name: Stop round-trip against the compose stack
        # KEEP leaves the stack up so the log-collection step below can read it;
        # the always() step at the end tears it down.
        env:
          O11Y_ROUNDTRIP_KEEP: "1"
        run: node runner/containers/o11y/local/stop-roundtrip.mjs

      # The production ClickHouse datasource variant (empty header env) is the
      # one no other boot exercises.
      - name: Production datasource variant boots
        run: node runner/containers/o11y/local/prod-datasource-check.mjs

      - name: Collect compose logs
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/o11y-box-logs"
          docker compose -p o11y-stop-roundtrip -f runner/containers/o11y/compose.yml \
            logs --no-color --timestamps > "${RUNNER_TEMP}/o11y-box-logs/compose.log" 2>&1 || true

      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: o11y-box-compose-logs
          path: ${{ runner.temp }}/o11y-box-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down the compose stack
        if: always()
        run: docker compose -p o11y-stop-roundtrip -f runner/containers/o11y/compose.yml down -v

  # Schedule and manual runs only: wrangler's container runtime reaches MinIO
  # through host.docker.internal, which this Linux runner has not yet proven it
  # resolves, so a PR is not gated on it.
  idle-stop:
    if: github.event_name != 'pull_request'
    # Until it has run green once on ubuntu-latest.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: runner/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml

      - name: Install and build the workspace
        working-directory: runner
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Isolate this job's wrangler dev registry
        run: echo "WRANGLER_REGISTRY_PATH=${RUNNER_TEMP}/wrangler-registry" >> "$GITHUB_ENV"

      - name: Idle stop against the real image
        id: idle
        env:
          # Linux host-gateway cannot reach ports published on 127.0.0.1 only.
          O11Y_COMPOSE_EXTRA_FILE: runner/containers/o11y/compose.ci.yml
          O11Y_IDLE_LOG: ${{ runner.temp }}/o11y-idle-stop/wrangler.log
        run: |
          mkdir -p "${RUNNER_TEMP}/o11y-idle-stop"
          node runner/containers/o11y/local/idle-stop.mjs

      - name: Upload the wrangler log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: o11y-idle-stop-logs
          path: ${{ runner.temp }}/o11y-idle-stop/
          retention-days: 7
          if-no-files-found: warn

      # continue-on-error hides a failed step from the run status, so surface it.
      - name: Report the idle-stop outcome
        if: always()
        env:
          IDLE_OUTCOME: ${{ steps.idle.outcome }}
        run: |
          echo "### idle-stop: ${IDLE_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${IDLE_OUTCOME}" != "success" ]; then
            echo "::warning title=o11y idle-stop::idle-stop check outcome was ${IDLE_OUTCOME} (job is continue-on-error; see the o11y-idle-stop-logs artifact)"
          fi

      - name: Tear down the compose stack
        if: always()
        run: docker compose -p o11y-idle-stop -f runner/containers/o11y/compose.yml -f runner/containers/o11y/compose.ci.yml down -v
