name: Deploy runner — API + Tier-2 container image

# Deploys the orchestration worker (handsontable-demos-api) to the main
# Handsontable Cloudflare account on push to master touching the API/containers.
# Runs CI first (test job) and only deploys if it passes. `wrangler deploy`
# builds + pushes the containers/live Tier-2 image (Vue baked) with Docker
# (present on ubuntu-latest). Auth: CLOUDFLARE_API_TOKEN secret.

on:
  push:
    branches: [master]
    paths:
      - "runner/workers/api/**"
      - "runner/containers/**"
      - "runner/scripts/**"
      - "runner/config/**"
      - "runner/packages/**"
      - "runner/pnpm-lock.yaml"
      - ".github/workflows/deploy-runner-api.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-runner-api
  cancel-in-progress: false # never cancel a container build/push mid-flight

jobs:
  # Gate: run the full CI suite (typecheck, unit/smoke, e2e) before deploying.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: runner/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Apply pending D1 schema changes to the remote DB before shipping code
      # that may depend on them. Migrations are idempotent (IF NOT EXISTS).
      - name: Apply D1 migrations (remote)
        working-directory: runner/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4.108.0 d1 migrations apply handsontable-demos --remote

      # ubuntu-latest ships Docker with the daemon running; wrangler uses it to
      # build + push the containers/live image referenced in wrangler.jsonc.
      - name: Deploy API worker (builds + pushes Tier-2 image)
        working-directory: runner/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4.108.0 deploy

      - name: Smoke test — prod API health
        working-directory: .
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://demos.handsontable.com/api/health || true)
            echo "health attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::prod /api/health did not return 200 after deploy"
          exit 1
