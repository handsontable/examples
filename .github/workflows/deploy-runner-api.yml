name: Deploy runner — API + Tier-2 container image

# Auto-deploys the orchestration worker (handsontable-demos-api) to the main
# Handsontable Cloudflare account on every push to master that touches the API
# or the container images. `wrangler deploy` builds the Tier-2 Sandbox image
# with Docker (present on ubuntu-latest runners), pushes it to the Cloudflare
# registry, and deploys the worker. Auth: CLOUDFLARE_API_TOKEN secret.
#
# Note: this rebuilds the container image (~several minutes). Path filters keep
# it from running on unrelated changes.

on:
  push:
    branches: [master]
    paths:
      - "runner/workers/api/**"
      - "runner/containers/**"
      - "runner/scripts/**"
      - "runner/config/**"
      - "runner/packages/**"
      - "runner/pnpm-lock.yaml"
      - ".github/workflows/deploy-runner-api.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-runner-api
  cancel-in-progress: false # never cancel a container build/push mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ubuntu-latest ships Docker with the daemon running; wrangler uses it to
      # build + push the containers/live image referenced in wrangler.jsonc.
      - name: Deploy API worker (builds + pushes Tier-2 image)
        working-directory: runner/workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4.108.0 deploy
