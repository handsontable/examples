name: E2E — live render (Sandpack bundler)

# Runs everything the deterministic PR suite (ci.yml) cannot: the tests that
# need the external hosted Sandpack bundler, a real Tier-2 container, the
# deployed API worker, or real LLM budget.
#
# Three ways in (DEV-2203):
#   - workflow_dispatch — the manual run. base_url empty (default) builds the
#     selected ref and tests it via a local `vite preview`; base_url set tests
#     the deployed app directly. `ai: true` adds the LLM answer checks;
#     `pkg_pr_new_ref` boots one container at a pkg.pr.new build (DEV-2198
#     validation days).
#   - schedule — the nightly prod canary (03:00 UTC, after the 01:00 starter
#     matrix). Deploy-time breakage is caught by the post-deploy smoke below;
#     the canary catches external drift — the hosted bundler, npm, the broker,
#     docs-bucket rot — and, at Dan's call, runs every live-gated test nightly.
#   - workflow_call with `smoke: true` — the post-deploy subset both deploy
#     workflows invoke: `--grep @smoke`, one container, a few minutes.
#
# Not a merge gate — owner decision: all of it depends on external services,
# so an outage would block merges.
#
# Only the deployed mode can cover the container suites. Tier-2 cases need the
# API worker reachable on the *same origin*, and local mode serves the app with
# `vite preview`, whose config has no API proxy (the proxy lives under
# `server:`). Backend-bound specs self-gate on E2E_BASE_URL for the same
# reason — locally they skip instead of failing on a preview stuck at booting.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed app URL to test (leave empty to build and test the selected ref locally)'
        default: ''
        required: false
      ai:
        description: 'Also run the live LLM answer checks (spends budget)'
        type: boolean
        default: false
      pkg_pr_new_ref:
        description: 'pkg.pr.new build id to verify end to end in a container (DEV-2198)'
        default: ''
        required: false
  schedule:
    # Nightly prod canary (Dan: every live-gated test runs every night, not
    # weekly). 03:00 UTC — deep overnight for the CET team, and two hours
    # after the nightly starter matrix (01:00) so the two never contend for
    # the same five container slots.
    - cron: '0 3 * * *'
  workflow_call:
    inputs:
      base_url:
        type: string
        required: true
      smoke:
        type: boolean
        default: false

permissions:
  contents: read

# Cancelling is safe in local mode only: deployed runs boot Tier-2 containers
# and a killed run strands its sessions in the global `Sandbox` pool of 5
# (specs clean up in `finally`, which a cancellation never reaches). The group
# is keyed by mode so a new cancellable *local* run can never cancel an
# in-flight *deployed* one, and smoke calls key by run id so two deploys never
# queue behind each other's smoke.
concurrency:
  group: e2e-live-${{ github.ref }}-${{ inputs.smoke && format('smoke-{0}', github.run_id) || (inputs.base_url != '' && 'deployed' || (github.event_name == 'schedule' && 'canary' || 'local')) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url == '' && !inputs.smoke }}

jobs:
  live:
    runs-on: ubuntu-latest
    # Same image rule as ci.yml: keep the tag in lockstep with @playwright/test
    # in runner/package.json — bump the two together, never apart.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    # Smoke: minutes. Full deployed run: the sandpack suite plus ~8 container
    # boots, strictly one at a time. Local run: seconds once built.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: runner
    env:
      # One place resolves the target: dispatch/call input, or prod when the
      # weekly canary fires (schedule events carry no inputs).
      BASE_URL: ${{ inputs.base_url || (github.event_name == 'schedule' && 'https://demos.handsontable.com' || '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: runner/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build workspace + authoring app (local mode only)
        if: env.BASE_URL == ''
        run: |
          pnpm build
          pnpm --filter @handsontable/demo-authoring build

      # ---- Post-deploy smoke: the @smoke subset and nothing else. ----------
      - name: Smoke — one render per engine, one share, one docs example, one Style round-trip
        if: inputs.smoke
        env:
          E2E_LIVE: '1'
          E2E_BASE_URL: ${{ env.BASE_URL }}
        run: pnpm e2e --grep "@smoke" --workers=1

      # ---- The full run (everything below skips when smoke). ---------------

      # Sandpack-only and API-read-only specs: no containers held, parallel-safe.
      # Backend-bound tests inside these files self-skip in local mode.
      - name: E2E — Sandpack live renders, docs examples, editor, versions, share viewer
        if: '!inputs.smoke'
        env:
          E2E_LIVE: '1'
          E2E_BASE_URL: ${{ env.BASE_URL }}
        run: >
          pnpm e2e
          e2e/docs-examples.spec.ts
          e2e/preview-recovery.spec.ts
          e2e/import-live.spec.ts
          e2e/row-striping.spec.ts
          e2e/preview-downloads.spec.ts
          e2e/editor-download.spec.ts
          e2e/version-pinning.spec.ts
          e2e/share-view.spec.ts
          e2e/style-panel.spec.ts
          e2e/preview-scheme.spec.ts
          e2e/preview-head-assets.spec.ts
          e2e/preview-injection-leak.spec.ts

      # Container suites, one worker: each Tier-2 case holds a live-preview
      # container, prod caps those at 5 *globally* (Sandbox max_instances), and
      # a parallel second boot reads as a product failure without being one.
      - name: E2E — container suites (Style shapes, docs frameworks, engine smoke)
        if: ${{ !inputs.smoke && env.BASE_URL != '' }}
        env:
          E2E_LIVE: '1'
          E2E_BASE_URL: ${{ env.BASE_URL }}
        run: >
          pnpm e2e
          e2e/style-apply.spec.ts
          e2e/docs-frameworks.spec.ts
          e2e/engine-smoke.spec.ts
          --workers=1

      # DEV-2198 validation: one real container at a pkg.pr.new build.
      - name: E2E — pkg.pr.new build end to end
        if: ${{ !inputs.smoke && env.BASE_URL != '' && inputs.pkg_pr_new_ref != '' }}
        env:
          E2E_BASE_URL: ${{ env.BASE_URL }}
          E2E_PKG_PR_NEW_REF: ${{ inputs.pkg_pr_new_ref }}
        run: pnpm e2e e2e/version-pinning.spec.ts -g "pkg.pr.new build boots" --workers=1

      # Local mode: Tier-1 Style shapes only — see the note at the top.
      - name: E2E — Style panel reaches the grid (local build, Tier 1 only)
        if: ${{ !inputs.smoke && env.BASE_URL == '' }}
        env:
          E2E_LIVE: '1'
        run: pnpm e2e e2e/style-apply.spec.ts --workers=1 -g "react|vue|javascript|switching"

      # The authed share round-trip needs a persistent API token, minted from
      # the app's API tokens page (ADR-0037). Absent, the step is skipped with a
      # notice — the secret is optional by design. Present and NOT validating is
      # a red run: this credential does not expire, so a refusal means revoked,
      # deleted, or broken, none of which should pass quietly. That is the whole
      # point of DEV-2583 — the broker token it replaced rotted hourly, so its
      # failure had to be a warning, and the step therefore never ran.
      - name: E2E — authed share round-trip (secret-gated)
        if: ${{ !inputs.smoke && env.BASE_URL != '' }}
        env:
          E2E_BASE_URL: ${{ env.BASE_URL }}
          # The session-leak spec (DEV-2567) drives the API directly and reads
          # the auth-gated /api/admin/sessions listing, so it rides this
          # token-gated step rather than the anonymous suites.
          E2E_API_BASE: ${{ env.BASE_URL }}
          E2E_API_TOKEN: ${{ secrets.E2E_API_TOKEN }}
        run: |
          if [ -z "$E2E_API_TOKEN" ]; then
            echo "::notice::E2E_API_TOKEN is not set — the authed share round-trip and the session-leak spec were skipped."
            exit 0
          fi
          # Probed against our own API rather than the broker, which knows
          # nothing about this credential. `/api/profile` rather than
          # `/api/tokens`: a token is fenced off token management entirely
          # (ADR-0037), and verifying the bearer is itself an `api_tokens` read,
          # so this exercises the new path either way.
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $E2E_API_TOKEN" \
            "$BASE_URL/api/profile" || true)
          if [ "$code" != "200" ]; then
            echo "::error::E2E_API_TOKEN did not validate ($code). A persistent token does not expire, so this means revoked, deleted, or broken — mint a new one on /api-tokens."
            exit 1
          fi
          # Secret hygiene (Bugbot, #189): this run puts a live session JWT in
          # sessionStorage and an Authorization header — a Playwright trace
          # records both, GitHub does not redact secrets inside artifact zips,
          # and this repo is public. No traces, no retries, and every artifact
          # of this step is scrubbed before the on-failure upload can see it.
          status=0
          pnpm e2e e2e/share-create-live.spec.ts e2e/session-abandoned-create.spec.ts --workers=1 --retries=0 --trace off || status=$?
          rm -rf test-results playwright-report
          exit $status

      # Two real LLM calls. On by dispatch input and on the weekly canary.
      - name: E2E — AI endpoints answer usably
        if: ${{ !inputs.smoke && env.BASE_URL != '' && (inputs.ai || github.event_name == 'schedule') }}
        env:
          E2E_AI: '1'
          E2E_BASE_URL: ${{ env.BASE_URL }}
        run: pnpm e2e e2e/ai-live.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          # playwright-report/ holds the html report, test-results/ the traces.
          path: |
            runner/playwright-report/
            runner/test-results/
          retention-days: 7
          if-no-files-found: warn
