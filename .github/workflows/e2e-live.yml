name: E2E — live render (Sandpack bundler)

# Runs the E2E_LIVE=1 checks — the tests that need the external hosted Sandpack
# bundler (or a real Tier-2 container) and therefore stay out of the
# deterministic PR suite (ci.yml):
#
#   - docs-examples.spec.ts   what actually renders inside a Tier-1 sandbox:
#                             grid boots, plugins work (context menu opens,
#                             getPlugin() succeeds), compiled JSX executes.
#                             Both DEV-2129 regressions (dead plugins, "React is
#                             not defined") were invisible to PR CI.
#   - style-apply.spec.ts     whether a generated theme module reaches the grid,
#                             one case per wiring shape (DEV-2197). The only
#                             suite that *executes* generated theme source; the
#                             node tests read it as text, and every defect it
#                             found was green under those.
#
# Manual only (not a merge gate — owner decision): depends on an external
# service, so a bundler outage would block merges. Run it:
#   - before merging any change to packages/runtime (sandpack.ts, transpile.ts)
#     or pipeline/import-docs.mjs — pick your branch in the dispatch UI;
#   - after a deploy / docs-bucket regen, with base_url pointed at prod.
#
# Two modes:
#   - base_url empty (default): builds the workspace from the selected ref and
#     tests it via a local `vite preview` (playwright.config.ts webServer) —
#     validates YOUR CODE against the live bundler before it ships.
#   - base_url set (e.g. https://demos.handsontable.com): tests the deployed
#     app directly — post-deploy smoke; no build needed.
#
# Only the deployed mode can cover the whole Style panel suite. Its `astro` and
# `angular` cases are Tier 2: they need the API worker reachable on the *same
# origin*, and local mode serves the app with `vite preview`, whose config has no
# API proxy (the proxy lives under `server:`). Locally those two are skipped
# rather than left to fail on a preview stuck at `booting`.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed app URL to test (leave empty to build and test the selected ref locally)'
        default: ''
        required: false

permissions:
  contents: read

# Cancelling is safe in local mode only. That premise used to hold for the whole
# workflow — Tier-1 render checks hold nothing server-side — but the deployed
# Style panel step boots Tier-2 containers, and the spec has no teardown: its
# sessions are left to expire. Killing a run mid-flight therefore strands them in
# the global `Sandbox` pool of 5 and starves live previews, which is why
# `e2e-starter-matrix.yml` disables cancellation outright.
#
# The group is keyed by mode as well as by ref. Sharing one group would let a new
# *local* run — which is cancellable — cancel an in-flight *deployed* run, and
# that is precisely the leak this avoids.
concurrency:
  group: e2e-live-${{ github.ref }}-${{ inputs.base_url != '' && 'deployed' || 'local' }}
  cancel-in-progress: ${{ inputs.base_url == '' }}

jobs:
  live:
    runs-on: ubuntu-latest
    # Local live run takes seconds once built; leave headroom for a cold
    # hosted-bundler transpile of the heavier examples. The deployed run also
    # boots four real containers for the Style panel suite, one at a time.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: runner/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build workspace + authoring app (local mode only)
        if: inputs.base_url == ''
        run: |
          pnpm build
          pnpm --filter @handsontable/demo-authoring build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E with live-render checks
        env:
          E2E_LIVE: '1'
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: pnpm e2e e2e/docs-examples.spec.ts

      # A separate step, and `--workers=1`: the Tier-2 cases each hold a
      # live-preview container, prod caps those at 5 concurrently *globally*
      # (Sandbox max_instances), and sessions are not torn down between tests. In
      # parallel the second one fails with the preview stuck on `booting`, which
      # reads as a product failure and is not one.
      - name: E2E — Style panel reaches the grid (deployed, all wiring shapes)
        if: inputs.base_url != ''
        env:
          E2E_LIVE: '1'
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: pnpm e2e e2e/style-apply.spec.ts --workers=1

      # Local mode: Tier-1 shapes only — see the note at the top of this file.
      - name: E2E — Style panel reaches the grid (local build, Tier 1 only)
        if: inputs.base_url == ''
        env:
          E2E_LIVE: '1'
        run: pnpm e2e e2e/style-apply.spec.ts --workers=1 -g "react|vue|javascript|switching"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          # playwright-report/ holds the html report, test-results/ the traces.
          path: |
            runner/playwright-report/
            runner/test-results/
          retention-days: 7
          if-no-files-found: warn
