name: CI

# The reusable CI suite, as a DAG (same shape as the handsontable monorepo's
# test workflow): build fans out to the consumers, artifacts are passed instead
# of rebuilt, and the Playwright job runs inside the pinned Playwright
# container so the browser always matches the test package.
#
#   unit ──► build ──► authoring ──► e2e
#   presence (PR-only, needs nothing — runs in parallel)
#
# unit gates build: it is the cheapest job (pnpm test builds the runtime
# itself, by design), so a broken helper fails the run before any minutes go
# into the app build or a browser container.
#
# presence is the test-presence gate (runner/docs/TESTING.md): a PR that
# changes runner source must also change a test, or declare a Refactor-only:/
# Test-plan: trailer. It only fires on pull_request — a master push arrives
# here via workflow_call after its PR already passed it, and has no base to
# diff against anyway.
#
# The live-render checks that need the external Sandpack bundler stay gated
# behind E2E_LIVE (e2e-live.yml). Also callable (workflow_call) so the deploy
# workflows can gate on the whole DAG.

# No push trigger of its own, and master.yml does not call it either: the full
# suite runs on every PR, and a master push goes straight to deploy with the
# @smoke subset verifying production afterwards (master.yml). workflow_call
# stays for any future caller; workflow_dispatch for by-hand runs.
on:
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}

# Scope the group by the top-level workflow so a standalone CI run and a CI run
# invoked as the deploy gate (workflow_call) never share a group and cancel each
# other. `github.workflow` is the caller's workflow when reused.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate diffs the PR range against its base — it needs history,
          # not just the merge commit.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node v5 auto-enables pnpm caching from the root package.json
          # `packageManager` field; this job never installs pnpm.
          package-manager-cache: false

      - name: Test-presence gate (source change ⇒ test change)
        run: node runner/scripts/check-test-presence.mjs "${{ github.base_ref }}"

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: runner/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Unit + catalog-smoke tests
        run: pnpm test

  build:
    needs: unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v5

      # Read the pnpm version from runner/package.json's packageManager field
      # (avoids a conflict with the repo-root package.json).
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: runner/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Typecheck rides with build: apps/authoring typechecks against
      # packages/runtime/dist, which this job just produced.
      - name: Typecheck
        run: pnpm typecheck

      - name: Upload the runtime build
        uses: actions/upload-artifact@v6
        with:
          name: runtime-dist
          path: runner/packages/runtime/dist/
          retention-days: 1
          if-no-files-found: error

  authoring:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: runner/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Download the runtime build
        uses: actions/download-artifact@v7
        with:
          name: runtime-dist
          path: runner/packages/runtime/dist/

      - name: Build authoring (build smoke + e2e target)
        run: pnpm --filter @handsontable/demo-authoring build

      # Two properties of the *bundle* that no unit test can see: the compiler chunk keeps a
      # hash-free path (a rotated hashed chunk answers the SPA fallback and strands open tabs
      # — DEV-2569 / DEMOS-15), and it stays lazily imported rather than joining the initial
      # load. Checked here because this is the job that has the build.
      - name: Check the compiler chunk (DEV-2569)
        run: node scripts/check-compiler-chunk.mjs

      - name: Upload the authoring build
        uses: actions/upload-artifact@v6
        with:
          name: authoring-dist
          path: runner/apps/authoring/dist/
          retention-days: 1
          if-no-files-found: error

  e2e:
    needs: authoring
    runs-on: ubuntu-latest
    # The official Playwright image ships the browsers, so there is no
    # `playwright install` step. Keep this tag in lockstep with
    # `@playwright/test` in runner/package.json — bump the two together, never
    # apart (the same rule the handsontable monorepo enforces via its pnpm
    # catalog comment).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: runner/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Download the authoring build (the e2e target)
        uses: actions/download-artifact@v7
        with:
          name: authoring-dist
          path: runner/apps/authoring/dist/

      - name: E2E (Playwright)
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          # playwright-report/ holds the html report, test-results/ the traces.
          path: |
            runner/playwright-report/
            runner/test-results/
          retention-days: 7
          if-no-files-found: warn

  # T10 — the CI home the local telemetry path (contract §10) never had
  # (T06-D8/T07: E2E_TELEMETRY specs were flagged but never wired). Its own
  # build, separate from the `authoring`/`e2e` jobs above: VITE_TELEMETRY_LOCAL=1
  # must never reach the real authoring-dist artifact those jobs share (the
  # post-build leak check in master.yml exists specifically to catch that), so
  # this job builds its own dist and never uploads it. Both specs are
  # self-contained — their own preview server (telemetry-faro.spec.ts: 4711,
  # example-analytics.spec.ts: 5301), `page.route` interception of
  # `/telemetry/collect`, no o11y worker or API worker — so they fit the
  # deterministic PR suite unlike e2e/telemetry-metrics.spec.ts (E2E_LIVE +
  # a local API worker + a live Tier-2 container). That spec, plus
  # e2e/o11y-local.spec.ts (E2E_O11Y_LOCAL, needs Docker + two `wrangler dev`
  # processes + a compose stack on top), have their own workflow instead —
  # `.github/workflows/e2e-o11y-local.yml` — kept off the per-PR gate and run
  # on workflow_dispatch, nightly, and PRs that touch the ingest path. See
  # docs/run-and-deploy.md's "Tests (CI)" section.
  e2e-telemetry:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v5

      # Minor triage item 5 (C-M7/D-M8): the leak checks used to run ONLY
      # post-merge, in master.yml, after the production authoring bundle had
      # already been built there — a regression that broke dead-code
      # elimination of the local telemetry seam (or the dev-login bypass
      # sentinel check itself) was only caught after merge, as a blocked
      # deploy. actionlint here too, so a workflow-YAML mistake in either
      # fix is itself caught in PR CI, not just by reading the diff.
      - name: actionlint (workflow YAML)
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: runner/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runner/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Download the runtime build
        uses: actions/download-artifact@v7
        with:
          name: runtime-dist
          path: runner/packages/runtime/dist/

      # Production-mode build (no VITE_TELEMETRY_LOCAL) — the same shape
      # master.yml's `build` job ships, built here too so both leak checks
      # run in PR CI, not only after merge.
      - name: Build authoring in production mode
        run: pnpm --filter @handsontable/demo-authoring build

      # Same check as master.yml's "Leak check — dev-login bypass must not
      # reach the production bundle" step (AGENTS.md's own sanity check),
      # now also gating the PR instead of only a post-merge deploy.
      - name: Leak check — dev-login bypass must not reach the production bundle
        run: |
          if grep -rl "localhost:8787\|VITE_DEV_USER\|dev@handsontable.com" apps/authoring/dist; then
            echo "::error::dev-login bypass leaked into the production bundle — rebuild with .env.local absent (AGENTS.md)"
            exit 1
          fi
          echo "ok: no dev-bypass sentinel found"

      # Same check as master.yml's "Leak check — local telemetry path must
      # not reach the production bundle" step (contract §10).
      - name: Leak check — local telemetry path must not reach the production bundle
        run: pnpm check:telemetry-leak

      - name: Build authoring with the local telemetry path (contract §10)
        run: pnpm --filter @handsontable/demo-authoring build
        env:
          VITE_TELEMETRY_LOCAL: '1'

      # Negative control (minor triage item 5 / D-M8): nothing in CI
      # previously proved `check:telemetry-leak` can actually FAIL — only
      # that it passes against builds where the sentinels are already
      # absent. Assert it fails against a build made WITH the local
      # telemetry path enabled; if the checker itself regresses (a
      # dead-code-elimination change, a sentinel string edit) and stops
      # detecting the leak, this step turns red instead of the check quietly
      # passing everything forever.
      - name: Leak check negative control — check:telemetry-leak must FAIL against a VITE_TELEMETRY_LOCAL=1 build
        run: |
          if pnpm check:telemetry-leak; then
            echo "::error::check:telemetry-leak passed against a VITE_TELEMETRY_LOCAL=1 build — the leak check itself is broken"
            exit 1
          fi
          echo "ok: check:telemetry-leak correctly failed against the flag build"

      - name: E2E — Faro in the authoring app + example-analytics (T06, T12)
        env:
          E2E_TELEMETRY: '1'
        run: pnpm e2e e2e/telemetry-faro.spec.ts e2e/example-analytics.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-telemetry
          path: |
            runner/playwright-report/
            runner/test-results/
          retention-days: 7
          if-no-files-found: warn
