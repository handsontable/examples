name: Live image

# Builds the Tier-2 `containers/live` image on a PR that changes it, on the
# same hosted runner `deploy-api` (master.yml) builds it on. Nothing else
# builds this image before merge, so an image that cannot build on that runner
# used to surface only as a failed production deploy.

on:
  pull_request:
    paths:
      - runner/containers/live/**
      - runner/scripts/prepare-container.mjs
      - .github/workflows/live-image.yml

concurrency:
  group: live-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context: [head, pre-455]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use the containers/live context from before the cache prime
        if: matrix.context == 'pre-455'
        run: git checkout 8da88ed96 -- runner/containers/live

      - name: Docker setup
        run: |
          docker version --format 'server {{.Server.Version}}'
          docker info --format 'driver {{.Driver}}, images {{.DriverStatus}}'
          df -h /
          free -m

      # Same platform wrangler builds for. The background loop logs free disk,
      # memory and dockerd's resident size every 10 s, so a runner that dies
      # mid-build still leaves the numbers.
      - name: Build containers/live
        run: |
          ( while sleep 10; do
              echo "mon: $(df -h / | awk 'NR==2 {print "disk used " $3 " avail " $4}'), $(free -m | awk '/^Mem:/ {print "mem used " $3 " / " $2 " MB"}'), dockerd rss $(ps -C dockerd -o rss= | awk '{s+=$1} END {print int(s/1024)}') MB"
            done ) &
          monitor=$!
          docker build --platform linux/amd64 -t live-image-check runner/containers/live
          kill "$monitor"

      - name: Image size and disk after the build
        run: |
          docker image ls live-image-check
          docker history --format '{{.Size}}\t{{.CreatedBy}}' live-image-check | head -40
          df -h /
